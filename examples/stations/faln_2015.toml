# Fallon, NV for 2015, built from the CSVs in tests/data/ and validated
# against the Ref-ET .out files shipped with them.
#
#   refet-report examples/stations/faln_2015.toml
#
# Relative paths are resolved against this file's directory.
# See faln_2024_live.toml for the same station fetched straight from AgriMet.

title = "Fallon, Nevada"
name = "Fallon, NV (FALN) AgriMet"
network = "AgriMet"

start = 2015-01-01
end = 2015-12-31

# Olson timezone of the raw timestamps. AgriMet records local clock time, so
# this must be the DST-observing zone, not a fixed offset; the diurnal axis is
# re-binned onto standard time internally.
timezone = "US/Pacific"

# Passed straight through to refet.Daily / refet.Hourly.
method = "refet"
rso_type = "full"

[source]
type = "csv"

[station]
# Optional here: these would otherwise be scraped from the [daily] reference
# .out header. Required when no reference file is configured.
lat = 39.4575
lon = -118.77388
elev = 1208.5
zw = 3.0

[daily]
csv = "../../tests/data/FALN_Agrimet_daily_raw_2015.csv"
# Optional Ref-ET .out file to validate against. The validation panel and all
# of its statistics are omitted entirely when this is absent.
reference = "../../tests/data/FALN_Agrimet_daily_raw_2015.out"

[daily.columns]
# report variable = column name in the source
tmin = "MN"
tmax = "MX"
tdew = "YM"
uz = "UA"
rs = "SR"

[hourly]
csv = "../../tests/data/FALN_Agrimet_hourly_raw_2015.csv"
reference = "../../tests/data/FALN_Agrimet_hourly_raw_2015.out"

[hourly.columns]
tmean = "OB"
tdew = "TP"
uz = "WS"
rs = "SI"

[units]
# Any unit string refet.units.convert accepts. Omit or leave blank for the
# library defaults (C, m s-1, MJ m-2).
tmin = "F"
tmax = "F"
tmean = "F"
tdew = "F"
uz = "mph"
rs = "Langleys"
