# Builds the Sphinx docs and deploys them to GitHub Pages on pushes to main.
#
# One-time setup required on GitHub: repository Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install package with docs dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[docs]
    - name: Build docs
      run: sphinx-build -b html docs docs/_build/html
    - uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
